server:
  port: ${PORT:9002}
spring:
  application:
    name: users-service
  r2dbc:
    url: r2dbc:mariadb://localhost:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:${EUREKA_PORT}/eureka/